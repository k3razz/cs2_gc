name: Generate Protobuf Files

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gc/protobufs/*.proto'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      
      - name: Generate protobuf files
        run: |
          mkdir -p src/gc/protobufs
          protoc --cpp_out=src/gc/protobufs/ \
                 --proto_path=src/gc/protobufs/ \
                 src/gc/protobufs/*.proto
      
      - name: Check if files changed
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit generated files
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gc/protobufs/*.pb.cc src/gc/protobufs/*.pb.h
          git commit -m "Generate protobuf files from cs2_gc.proto"
          git push
