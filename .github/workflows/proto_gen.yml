name: Generate Protobuf Files

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/gc/protobufs/*.proto'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      
      - name: Download missing proto dependencies
        run: |
          mkdir -p src/gc/protobufs/google/protobuf
          mkdir -p src/gc/protobufs/steam
          
          # Скачиваем недостающие файлы из репозитория SteamTracking
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/google/protobuf/descriptor.proto -o src/gc/protobufs/google/protobuf/descriptor.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages.proto -o src/gc/protobufs/steam/steammessages.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages_base.proto -o src/gc/protobufs/steam/steammessages_base.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages_unified_base.proto -o src/gc/protobufs/steam/steammessages_unified_base.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages_cloud.proto -o src/gc/protobufs/steam/steammessages_cloud.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages_oauth.proto -o src/gc/protobufs/steam/steammessages_oauth.proto
          curl -L https://raw.githubusercontent.com/SteamTracking/Protobufs/master/steam/steammessages_player.proto -o src/gc/protobufs/steam/steammessages_player.proto
      
      - name: Generate protobuf files
        run: |
          protoc --cpp_out=src/gc/protobufs/ \
                 --proto_path=src/gc/protobufs/ \
                 --proto_path=src/gc/protobufs/steam \
                 --proto_path=src/gc/protobufs/google \
                 src/gc/protobufs/*.proto || true
      
      - name: Check if files changed
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit generated files
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/gc/protobufs/*.pb.cc src/gc/protobufs/*.pb.h
          git commit -m "Generate protobuf files from CS2 protos"
          git push
